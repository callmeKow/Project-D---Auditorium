# Virtual Music World — Local Infrastructure Baseline (PROPOSED)
# Includes PostgreSQL & Redis targets for production migration beyond in-memory/JSON MVP snapshot.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vmw-postgres
    environment:
      POSTGRES_DB: vmw
      POSTGRES_USER: vmw
      POSTGRES_PASSWORD: vmw_dev_password
    ports:
      - '5432:5432'
    volumes:
      - vmw_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vmw-redis
    ports:
      - '6379:6379'

volumes:
  vmw_pg_data:
